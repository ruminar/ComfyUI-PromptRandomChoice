name: Regression tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Python regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: |
          node --check web/prompt_random_choice.js
          node --check web/runtime_prompt_random_choice.js
      - name: Run frontend regression tests
        run: node --test tests/runtime_layout.test.mjs
